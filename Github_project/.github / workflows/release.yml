name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Debug - show repo contents
        run: |
          pwd
          ls -la
          echo "---- Github_project ----"
          ls -la Github_project || true
          echo "---- Github_project (find setup/pyproject) ----"
          find Github_project -maxdepth 2 -name "setup.py" -o -name "pyproject.toml" || true

      - name: Build sdist and wheel
        run: python -m build
        working-directory: Github_project

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: Github_project/dist
